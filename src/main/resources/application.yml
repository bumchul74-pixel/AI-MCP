spring:
  application:
    name: ai-mcp
  ai:
    mcp:
      server:
        enabled: true
        stdio: false
        name: ai-mcp-server
        version: 0.0.1
        instructions: MCP server exposing project analysis, source ontology search, server metadata, and DB-backed MyBatis artifact generation tools.
        type: SYNC
        protocol: STREAMABLE
        request-timeout: 20s
        expose-mcp-client-tools: true
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: false
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 30s
          disallow-delete: true
      client:
        enabled: ${DOWNSTREAM_MCP_ENABLED:${SECURE_CODING_MCP_ENABLED:false}}
        name: ai-mcp-downstream-client
        version: 0.0.1
        initialized: true
        type: SYNC
        request-timeout: ${DOWNSTREAM_MCP_REQUEST_TIMEOUT:${SECURE_CODING_MCP_REQUEST_TIMEOUT:900s}}
        streamable-http:
          connections:
            secure-coding-mcp:
              url: ${SECURE_CODING_MCP_URL:http://localhost:18090}
              endpoint: ${SECURE_CODING_MCP_ENDPOINT:/mcp}
            easyocr-mcp:
              url: ${EASYOCR_MCP_URL:http://localhost:8001}
              endpoint: ${EASYOCR_MCP_ENDPOINT:/ocr}
            ppt-mcp:
              url: ${PPT_MCP_URL:http://localhost:8002}
              endpoint: ${PPT_MCP_ENDPOINT:/ppt}

mcp:
  server:
    metadata:
      name: ai-mcp-server
      version: 0.0.1
      description: MCP server for analyzing Java projects, querying source ontology, and generating MyBatis artifacts.

  ontology:
    neo4j:
      uri: ${NEO4J_URI:bolt://localhost:7687}
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:neo4j_password}
      database: ${NEO4J_DATABASE:neo4j}

  mybatis:
    datasource:
      url: ${MCP_MYBATIS_DB_URL:jdbc:postgresql://localhost:5432/mcp}
      username: ${MCP_MYBATIS_DB_USERNAME:mcp}
      password: ${MCP_MYBATIS_DB_PASSWORD:mcp}
      driver-class-name: ${MCP_MYBATIS_DB_DRIVER:org.postgresql.Driver}
    generator:
      base-package: ${MCP_MYBATIS_BASE_PACKAGE:com.example.app}
      default-schema: ${MCP_MYBATIS_DEFAULT_SCHEMA:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: 8092
logging:
  file:
    path: ${LOG_PATH:./logs/ai-mcp}
  level:
    root: INFO
    com.hanwha.mcp: INFO
