spring:
  application:
    name: ai-mcp
  ai:
    mcp:
      server:
        enabled: true
        stdio: false
        name: ai-mcp-server
        version: 0.0.1
        instructions: MCP server exposing project analysis, server metadata, and DB-backed MyBatis artifact generation tools.
        type: SYNC
        protocol: STREAMABLE
        request-timeout: 20s
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: false
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 30s
          disallow-delete: true

mcp:
  server:
    metadata:
      name: ai-mcp-server
      version: 0.0.1
      description: MCP server for analyzing Gradle/Spring Boot projects and generating MyBatis artifacts from database metadata.

  mybatis:
    datasource:
      url: ${MCP_MYBATIS_DB_URL:jdbc:postgresql://localhost:5432/mcp}
      username: ${MCP_MYBATIS_DB_USERNAME:mcp}
      password: ${MCP_MYBATIS_DB_PASSWORD:mcp}
      driver-class-name: ${MCP_MYBATIS_DB_DRIVER:org.postgresql.Driver}
    generator:
      base-package: ${MCP_MYBATIS_BASE_PACKAGE:com.example.app}
      default-schema: ${MCP_MYBATIS_DEFAULT_SCHEMA:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: 8092
logging:
  file:
    path: ${LOG_PATH:./logs/ai-mcp}
  level:
    root: INFO
    com.hanwha.mcp: INFO
