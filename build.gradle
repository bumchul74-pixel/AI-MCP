plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hanwha'
version = '0.0.1-SNAPSHOT'
description = 'Production-ready MCP Server'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += '-parameters'
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', '2.0.0')
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.ai:spring-ai-starter-mcp-client'
	implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
	implementation 'org.neo4j.driver:neo4j-java-driver'
	implementation 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	useJUnitPlatform {
		excludeTags 'docker-integration'
	}
	systemProperty 'spring.ai.mcp.client.enabled', 'false'
}

tasks.register('legacyInterfaceMcpTest', Test) {
	group = 'verification'
	description = 'Calls the legacy-interface MCP server running in Docker.'
	useJUnitPlatform {
		includeTags 'docker-integration'
	}
	systemProperty 'legacy.interface.mcp.url',
		System.getProperty('legacy.interface.mcp.url')
			?: System.getenv('LEGACY_INTERFACE_MCP_URL')
			?: 'http://localhost:18090/mcp'
}


def resolvePython = { String projectPath ->
	def baseDirectory = file(projectPath)
	def candidates = [
		new File(baseDirectory, '.venv/Scripts/python.exe'),
		new File(baseDirectory, '.venv/bin/python')
	]
	def virtualEnvPython = candidates.find { it.exists() }
	if (virtualEnvPython != null) {
		return virtualEnvPython.absolutePath
	}
	return System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3'
}

tasks.register('ragTest', Exec) {
	group = 'verification'
	description = 'Runs the Python RAG and OCR unit tests.'
	workingDir file('rag-server')
	commandLine resolvePython('rag-server'), '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_*.py'
}

tasks.register('pptTest', Exec) {
	group = 'verification'
	description = 'Runs the Python PPT MCP unit tests.'
        workingDir file('rag-server')
        def pptPython = file('rag-server/.venv-ppt/Scripts/python.exe')
        def pptPythonUnix = file('rag-server/.venv-ppt/bin/python')
        def executable = pptPython.exists()
                ? pptPython.absolutePath
                : (pptPythonUnix.exists() ? pptPythonUnix.absolutePath : resolvePython('rag-server'))
        commandLine executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_ppt_mcp.py'
}

tasks.register('pythonServicesTest') {
	group = 'verification'
	description = 'Runs all Python service unit tests owned by AI-MCP.'
	dependsOn tasks.named('ragTest'), tasks.named('pptTest')
}
